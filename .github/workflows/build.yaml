name: Build and publish

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: self-hosted
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle Wrapper
      run: ./gradlew build
