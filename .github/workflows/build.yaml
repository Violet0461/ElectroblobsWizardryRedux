name: Build EBW Redux
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    container:
      image: eclipse-temurin:17-jdk # Ersetzen durch 21-jdk falls nötig
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-mod
          path: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar